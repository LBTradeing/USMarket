name: Enrich Company Profiles (AI & Exchanges)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of pending profiles to enrich (0 = all pending)'
        required: false
        default: '0'

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run profile enrichment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENRICH_LIMIT: ${{ github.event.inputs.limit }}
        run: python enrich_profiles.py
